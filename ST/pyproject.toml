[project]
name = "st-translator"
version = "1.0.0"
description = "Lightweight on-screen hover translator powered by local Gemma 4 model on Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "pynput>=1.7.6",
    "uiautomation>=2.0.20",
    "pywin32>=306; sys_platform == 'win32'",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
